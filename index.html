<style>
/* Concepto: libreta de despacho con portada de marca: logo grande sobre placa blanca, frutillas, flores y hojas dibujadas a mano en trazo fino verde y frambuesa. */
/* (antes) libreta de despacho. Misma identidad que Visitas Llahuen: formulario corto arriba, guías de reposición abajo; resumen como planilla de bodega con barras. */
:root {
  --bg: #EDF0EA; --surface: #FFFFFF; --surface-2: #F5F7F3; --ink: #17251D; --muted: #5B6A60; --line: #D3DBD1;
  --leaf: #2A6846; --leaf-soft: #DCEBE1; --berry: #B1243B; --berry-soft: #F6DDE1;
  --ok: #2E7D4F; --warn: #B26B00; --bad: #BE3030; --info: #1F6F8B;
  --font-display: "Bricolage Grotesque", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1611; --surface: #18211B; --surface-2: #1E2921; --ink: #E5EDE6; --muted: #95A59A; --line: #2C382F;
    --leaf: #78C795; --leaf-soft: #20382A; --berry: #F2788A; --berry-soft: #43202A;
    --ok: #6FCB93; --warn: #E3A33A; --bad: #F07A7A; --info: #5DB4D4; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1611; --surface: #18211B; --surface-2: #1E2921; --ink: #E5EDE6; --muted: #95A59A; --line: #2C382F;
  --leaf: #78C795; --leaf-soft: #20382A; --berry: #F2788A; --berry-soft: #43202A;
  --ok: #6FCB93; --warn: #E3A33A; --bad: #F07A7A; --info: #5DB4D4; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 96px;
}
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
h2 { font-size: 24px; } h3 { font-size: 17px; }
button, input, select, textarea { font: inherit; color: inherit; }
.wrap { max-width: 860px; margin: 0 auto; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); } .small { font-size: 13px; }
:focus-visible { outline: 3px solid var(--info); outline-offset: 2px; }

.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding: 14px 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 21px; }
.brand b { color: var(--berry); }
.sync { white-space: nowrap; font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync.on i { background: var(--ok); } .sync.off i { background: var(--warn); }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding: 6px max(16px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.tabs-in { max-width: 860px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tab { border: 0; background: transparent; padding: 8px 4px; border-radius: 10px; font-weight: 600; font-size: 13px; color: var(--muted); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; }
.tab[aria-current="true"] { color: var(--leaf); background: var(--leaf-soft); }
.tab svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

section.view { padding-top: 18px; display: flex; flex-direction: column; gap: 16px; }
.h-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; font-size: 14px; min-height: 44px; }
.btn:hover { border-color: var(--leaf); }
.btn.primary { background: var(--leaf); border-color: var(--leaf); color: var(--surface); }
.btn.danger { color: var(--bad); }
.btn.danger.armed { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.btn.sm { min-height: 36px; padding: 6px 10px; font-size: 13px; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field > label { font-size: 12px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
input, select, textarea { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
textarea { min-height: 70px; resize: vertical; }
input:focus-visible, select:focus-visible, textarea:focus-visible { outline-offset: 0; border-color: var(--info); }
input[aria-invalid="true"] { border-color: var(--bad); }
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; align-items: end; }
@media (max-width: 480px) { .grid3 { grid-template-columns: 1fr 1fr; } .grid3 .pct { grid-column: 1 / -1; } }
.hint { font-size: 12.5px; color: var(--muted); }
.err { font-size: 12.5px; color: var(--bad); }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.pct { border: 1px solid var(--line); border-radius: 10px; background: var(--surface-2); min-height: 46px; padding: 6px 12px; display: flex; flex-direction: column; justify-content: center; }
.pct span { font-size: 11px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.pct b { font-family: var(--font-mono); font-size: 20px; font-weight: 500; color: var(--berry); line-height: 1.1; }
.formbar { display: flex; gap: 8px; } .formbar .btn { flex: 1; }

/* lista */
.filters { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.list { display: flex; flex-direction: column; gap: 8px; }
.rcard { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; }
.rcard .nm { font-weight: 600; overflow-wrap: anywhere; }
.rcard .meta { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.rcard .num { text-align: right; font-family: var(--font-mono); font-variant-numeric: tabular-nums; font-size: 13px; color: var(--muted); }
.rcard .num b { display: block; font-size: 18px; font-weight: 500; color: var(--berry); }
.rcard .acts { grid-column: 1 / -1; display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; align-items: center; border-top: 1px solid var(--line); padding-top: 10px; margin-top: 4px; }
.rcard .acts .btn { display: inline-flex; align-items: center; gap: 6px; min-height: 40px; }
.rcard .acts .btn .ico { width: 18px; height: 18px; stroke-width: 4; }
.rcard .acts.confirm { justify-content: space-between; background: var(--berry-soft); border-radius: 10px; border-top: 0; padding: 10px; }
.rcard .acts.confirm span { font-size: 13.5px; flex: 1 1 200px; color: var(--ink); }
.rcard.editing { border-color: var(--info); box-shadow: 0 0 0 2px color-mix(in srgb, var(--info) 30%, transparent); }
.editbar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; background: color-mix(in srgb, var(--info) 12%, var(--surface)); border: 1px solid color-mix(in srgb, var(--info) 45%, var(--line)); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
.tag { font-family: var(--font-mono); font-size: 11.5px; color: var(--leaf); background: var(--leaf-soft); padding: 2px 8px; border-radius: 5px; }
.tag.m { color: var(--berry); background: var(--berry-soft); }
.ejemplo { font-family: var(--font-mono); font-size: 10.5px; color: var(--berry); border: 1px dashed var(--berry); padding: 1px 6px; border-radius: 4px; }
.empty { border: 1.5px dashed var(--line); border-radius: 14px; padding: 24px 18px; text-align: center; }
.empty p { margin: 0 auto; max-width: 46ch; }

/* resumen */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.kpi span { font-size: 11.5px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.kpi b { font-family: var(--font-mono); font-weight: 500; font-size: 24px; font-variant-numeric: tabular-nums; }
.kpi.hl b { color: var(--berry); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; min-height: 36px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--leaf); color: var(--surface); }
.bars { display: flex; flex-direction: column; gap: 9px; }
.bar { display: grid; grid-template-columns: minmax(90px, 34%) minmax(0, 1fr); gap: 10px; align-items: center; font-size: 13.5px; }
.bar .lb { overflow-wrap: anywhere; line-height: 1.25; }
.bar .tr { position: relative; height: 22px; background: var(--surface-2); border-radius: 5px; }
.bar .fl { position: absolute; inset: 0 auto 0 0; background: var(--leaf); border-radius: 5px; min-width: 2px; }
.bar.pc .fl { background: var(--berry); }
.bar .vl { position: absolute; top: 50%; transform: translateY(-50%); left: calc(var(--w) + 6px); font-family: var(--font-mono); font-size: 12px; white-space: nowrap; color: var(--ink); }
.bar .vl.in { left: auto; right: calc(100% - var(--w) + 6px); color: var(--surface); }
.trend svg { width: 100%; max-width: 760px; height: auto; display: block; margin: 0 auto; }
.trend text { fill: var(--muted); font-family: var(--font-mono); font-size: 10px; }
.trend .gl { stroke: var(--line); stroke-width: 1; }
.trend .c1 { fill: var(--leaf); } .trend .c2 { fill: var(--berry); }
.trend .pl { fill: none; stroke: var(--ink); stroke-width: 1.6; } .trend .pd { fill: var(--surface); stroke: var(--ink); stroke-width: 1.6; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
details summary { cursor: pointer; font-size: 13px; font-weight: 600; color: var(--leaf); }
.tbl { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; margin-top: 8px; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; white-space: normal; min-width: 130px; }
th { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); font-weight: 600; }
td.n { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
tr:last-child td { border-bottom: 0; }
tfoot td { font-weight: 600; background: var(--surface-2); }
/* portada y dibujos a mano */
.hero { position: relative; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 18px 22px; align-items: center; padding: 22px 0 6px; }
.plate { background: #FFFFFF; border-radius: 18px; padding: 12px 16px; box-shadow: 0 1px 0 var(--line), 0 10px 30px -18px color-mix(in srgb, var(--leaf) 60%, transparent); border: 1px solid var(--line); line-height: 0; }
.plate img { width: clamp(150px, 30vw, 250px); height: auto; display: block; }
.hero-t { display: flex; flex-direction: column; gap: 6px; min-width: 0; position: relative; z-index: 1; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--berry); }
.hero h1 { font-size: clamp(26px, 5vw, 38px); line-height: 1.05; }
.hero p { margin: 0; color: var(--muted); max-width: 40ch; }
.hero-art { position: absolute; right: -6px; top: 6px; width: clamp(96px, 20vw, 170px); height: auto; fill: none; stroke: var(--berry); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: .55; filter: url(#rough); pointer-events: none; }
.hero-art .lf { stroke: var(--leaf); }
@media (max-width: 560px) { .hero { grid-template-columns: 1fr; justify-items: center; text-align: center; } .hero-t { align-items: center; } .plate img { width: min(72vw, 280px); } .hero-art { width: 84px; right: -4px; top: 4px; opacity: .45; } }
.vine { display: block; width: 100%; height: 26px; color: var(--leaf); fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; filter: url(#rough-sm); opacity: .7; }
.vine .b { stroke: var(--berry); }
.ico { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 3.6; stroke-linecap: round; stroke-linejoin: round; flex: none; filter: url(#rough-sm); }
h3 { display: flex; align-items: center; gap: 8px; }
h3 .ico { color: var(--leaf); }
h3 .ico.b { color: var(--berry); --ifill: var(--berry-soft); }
.tab .ico { width: 24px; height: 24px; stroke-width: 3.4; }
.bgart2 { position: fixed; right: -50px; bottom: calc(60px + env(safe-area-inset-bottom, 0px)); width: min(92vw, 600px); height: auto; z-index: 0; pointer-events: none; fill: none; stroke: var(--leaf); stroke-width: 1.15; stroke-linecap: round; stroke-linejoin: round; opacity: .3; filter: url(#rough-sm); }
.bgart2 use[href="#i-berry-art"], .bgart2 use[href="#i-blossom-art"] { stroke: var(--berry); }
.wrap { position: relative; z-index: 1; }
.panel, .rcard, .kpi, .empty, .tbl { background: color-mix(in srgb, var(--surface) 92%, transparent); }
.empty { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty svg { width: 70px; height: auto; fill: none; stroke: var(--berry); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; filter: url(#rough); }
.kpi.hl { border-color: color-mix(in srgb, var(--berry) 45%, var(--line)); }
/* computador: pantalla ancha */
.col-form, .col-list, .rgrid { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (min-width: 1000px) {
  .wrap, .tabs-in { max-width: 1180px; }
  body { padding-block: 64px 32px; }
  .tabs { top: 0; bottom: auto; border-top: 0; border-bottom: 1px solid var(--line); padding-top: calc(6px + env(safe-area-inset-top, 0px)); padding-bottom: 6px; }
  .tabs-in { grid-template-columns: repeat(2, 200px); justify-content: end; }
  .tab { min-height: 42px; }
  .toast { bottom: 24px; }
  section.view.reg { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 24px; align-items: start; }
  .col-form { position: sticky; top: 80px; }
  .rgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
  .kpis { grid-template-columns: repeat(5, 1fr); }
  .bgart2 { bottom: 0; }
}
.copybox { position: fixed; inset: 0; z-index: 60; background: color-mix(in srgb, var(--ink) 50%, transparent); display: flex; align-items: center; justify-content: center; padding: 16px; }
.copybox > div { background: var(--surface); border-radius: 14px; padding: 16px; width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 10px; }
.copybox b { font-weight: 500; font-size: 14px; }
.copybox textarea { font-family: var(--font-mono); font-size: 12px; min-height: 160px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(80px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 40; font-size: 14px; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: no-preference) { .bar .fl { transition: width .3s ease; } }
</style>

<script>
const DIRECTORIO = {"zonas": ["Norte", "Zona Central", "Maule", "Ñuble", "Araucanía", "Sur"], "rows": []};
const FOTOPER = {
  dc: ["Camarosa", "Camino Real", "Fronteras", "Adelanto", "Merced", "Belvedere", "Castaic"],
  dn: ["San Andreas", "Albion", "Monterey", "Cabrillo", "Alturas", "Portola", "Artesia", "Carpinteria", "Sweet Carolina"]
};
const MOTIVOS = ["Mortalidad / prendimiento", "Calidad de planta", "Sanidad / enfermedad", "Daño en transporte", "Error de despacho o variedad", "Plantas faltantes en la entrega", "Condiciones climáticas", "Otro"];
const COL = "reposiciones";
const LSKEY = "llahuen-repo-local";
const EJEMPLOS = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nrm = x => String(x || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
const pad = n => String(n).padStart(2, "0");
const todayISO = () => { const t = new Date(); return `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`; };
const fmtD = d => { if (!d) return "—"; const x = new Date(d + "T12:00:00"); return isNaN(x) ? d : x.toLocaleDateString("es-CL", { day: "2-digit", month: "short", year: "numeric" }).replace(".", ""); };
const nf = (n, d = 0) => Number(n || 0).toLocaleString("es-CL", { maximumFractionDigits: d, minimumFractionDigits: d });
const pctOf = (rep, ent) => ent > 0 ? rep / ent * 100 : null;
const pctTxt = p => p == null ? "—" : nf(p, 1) + "%";
const uniq = a => [...new Set(a)];
const ico = (id, b) => `<svg class="ico ${b ? "b" : ""}" aria-hidden="true"><use href="#i-${id}"/></svg>`;
const MESES = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const fotoper = v => FOTOPER.dc.includes(v) ? "Día corto" : FOTOPER.dn.includes(v) ? "Día neutro" : "";
let DIRMAP = new Map();
function setDirectorio(d) { if (!d || !Array.isArray(d.rows)) return false; DIRECTORIO.rows = d.rows; if (Array.isArray(d.zonas) && d.zonas.length) DIRECTORIO.zonas = d.zonas; DIRMAP = new Map(DIRECTORIO.rows.map(r => [nrm(r[1]), r])); return true; }
try { setDirectorio(JSON.parse(localStorage.getItem("llahuen-repo-dir"))); } catch (e) { }
const zonaDe = p => { const r = DIRMAP.get(nrm(p)); return r ? DIRECTORIO.zonas[r[0]] || "Sin zona" : "Sin zona"; };
const zonaR = r => { const z = zonaDe(r.productor); return z !== "Sin zona" ? z : (r.zona || "Sin zona"); };

let toastT;
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 3200); }
function setSync(c, t) { const s = $("#sync"); s.className = "sync " + c; s.querySelector("span").textContent = t; }

const S = {
  rows: [], db: null, dl: null, loaded: false, tab: "reg",
  form: null, editId: null, armed: null, q: "",
  f: { desde: "", hasta: "", zona: "", variedad: "", productor: "" },
  metric: {}
};
const newForm = () => ({ fecha: todayISO(), productor: "", variedad: "", motivo: "", sector: "", entregada: "", repuesta: "", obs: "" });
S.form = newForm();

/* ---------- datos ---------- */
const realRows = () => S.rows;
const shownRows = () => S.rows;
const usingExamples = () => false;
function loadLocal() { try { return JSON.parse(localStorage.getItem(LSKEY) || "[]"); } catch (e) { return []; } }
function saveLocal() { try { localStorage.setItem(LSKEY, JSON.stringify(S.rows)); } catch (e) { } }
/* ---------- sincronización con el equipo ---------- */
const STANDALONE = !(window.claude && window.claude.use);
const CFGKEY = "llahuen-repo-cfg", PENDKEY = "llahuen-repo-pend";
const lsGet = (k, d) => { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } };
let CFG = lsGet(CFGKEY, {}), PEND = lsGet(PENDKEY, { upserts: {}, deletes: [] });
/* equipo en línea: misma base de datos y mismo código que la app de Visitas */
const SBC = window.LLAHUEN_CONFIG || {};
const TEAM = STANDALONE && !!(SBC.supabaseUrl && SBC.supabaseAnonKey);
const lsTeam = () => { try { return JSON.parse(localStorage.getItem("llahuen.codigo")); } catch (e) { return null; } };
let TCODE = SBC.teamCode || lsTeam(), TEAM_OK = TEAM && !!TCODE, TEAM_MSG = "";
async function sb(method, path, body, prefer) {
  const h = { apikey: SBC.supabaseAnonKey, Authorization: "Bearer " + SBC.supabaseAnonKey, "x-llahuen-key": TCODE || "", "Content-Type": "application/json" };
  if (prefer) h.Prefer = prefer;
  const r = await fetch(SBC.supabaseUrl + "/rest/v1/" + path, { method, headers: h, body: body ? JSON.stringify(body) : undefined, cache: "no-store" });
  const txt = await r.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch (e) { }
  if (!r.ok) { const e = new Error((j && j.message) || ("HTTP " + r.status)); e.status = r.status; e.code = (r.status === 401 || r.status === 403 || (j && j.code === "42501")) ? "clave" : (j && j.code === "PGRST205") ? "tabla" : (j && j.code) || "error"; throw e; }
  return j;
}
async function teamLoadDir() {
  try { const d = await sb("GET", "directorio?select=data&id=eq.1"); const v = d && d[0] && d[0].data; if (v && setDirectorio(v)) { lsSet("llahuen-repo-dir", { zonas: DIRECTORIO.zonas, rows: DIRECTORIO.rows }); rebuildProd(); return true; } return !!(d && d.length); } catch (e) { if (e.code === "clave") throw e; return null; }
}
async function teamConnect(code) {
  TCODE = code.trim(); TEAM_MSG = "";
  try {
    const d = await sb("GET", "directorio?select=id&id=eq.1");
    if (!d || !d.length) { TEAM_MSG = "Código incorrecto. Usa el mismo código de la app de Visitas."; TCODE = lsTeam(); render(); return; }
  } catch (e) { TEAM_MSG = e.code === "clave" ? "Código incorrecto. Usa el mismo código de la app de Visitas." : "No se pudo conectar. Revisa tu internet e intenta de nuevo."; TCODE = lsTeam(); render(); return; }
  try { localStorage.setItem("llahuen.codigo", JSON.stringify(TCODE)); } catch (e) { }
  TEAM_OK = true; teamMigrate(); await teamLoadDir(); toast("Conectado: ya ves las reposiciones de todo el equipo"); render(); flushSheet(); startPolling();
}
function teamMigrate() {
  if (lsGet("llahuen-repo-team-migrado", false)) return;
  for (const r of S.rows) if (!r._ej) { const { id, ...doc } = r; queueUpsert(id, doc); }
  lsSet("llahuen-repo-team-migrado", true);
}
async function teamFlush() {
  if (pendCount()) {
    const ups = Object.values(PEND.upserts), dels = PEND.deletes.slice();
    if (ups.length) await sb("POST", "reposiciones?on_conflict=id", ups.map(u => { const { id, ...d } = u; return { id, data: d, actualizado: new Date(d.actualizado || Date.now()).toISOString() }; }), "resolution=merge-duplicates,return=minimal");
    if (dels.length) await sb("DELETE", "reposiciones?id=in.(" + dels.map(x => '"' + x + '"').join(",") + ")", null, "return=minimal");
    for (const u of ups) if (PEND.upserts[u.id] && PEND.upserts[u.id].actualizado === u.actualizado) delete PEND.upserts[u.id];
    PEND.deletes = PEND.deletes.filter(x => !dels.includes(x)); lsSet(PENDKEY, PEND);
  }
  const data = await sb("GET", "reposiciones?select=id,data&order=actualizado.desc&limit=5000");
  const del = new Set(PEND.deletes), mine = PEND.upserts;
  const rows = (data || []).filter(r => r.id && r.data && !del.has(r.id) && !mine[r.id]).map(r => ({ ...r.data, id: r.id, entregada: +r.data.entregada || 0, repuesta: +r.data.repuesta || 0 }));
  S.rows = [...rows, ...Object.values(mine)]; saveLocal(); rebuildProd();
}
let POLL = 0;
function startPolling() { if (POLL) return; POLL = setInterval(() => { if (document.visibilityState === "visible" && navigator.onLine !== false) flushSheet(); }, TEAM_OK ? 15000 : 90000); }
const sheetsOn = () => TEAM_OK;
const pendCount = () => Object.keys(PEND.upserts).length + PEND.deletes.length;
const hhmm = () => { const d = new Date(); return pad(d.getHours()) + ":" + pad(d.getMinutes()); };
function queueUpsert(id, doc) { PEND.upserts[id] = { id, ...doc }; PEND.deletes = PEND.deletes.filter(x => x !== id); lsSet(PENDKEY, PEND); }
function queueDelete(id) { delete PEND.upserts[id]; if (!PEND.deletes.includes(id)) PEND.deletes.push(id); lsSet(PENDKEY, PEND); }
function sheetStatus(extra) {
  if (!sheetsOn()) return;
  const n = pendCount();
  if (extra === "clave") setSync("off", "el código del equipo ya no es válido");
  else if (extra === "error" || navigator.onLine === false) setSync("off", n ? `sin señal · ${n} por subir` : "sin señal · al día en este teléfono");
  else setSync(n ? "off" : "on", n ? `${n} por subir` : `en línea con el equipo · ${hhmm()}`);
}
let flushing = false;
async function flushSheet() {
  if (!sheetsOn() || flushing) return;
  flushing = true;
  if (TEAM_OK) {
    try { await teamFlush(); sheetStatus(); softRender(); }
    catch (e) { if (e.code === "clave") { TEAM_OK = false; TEAM_MSG = "El código del equipo cambió. Escribe el código actual."; render(); } if (e.code === "tabla") { const n = pendCount(); setSync("off", `falta activar la base del equipo${n ? " · " + n + " por subir" : ""}`); } else sheetStatus(e.code === "clave" ? "clave" : "error"); }
    finally { flushing = false; }
  } else flushing = false;
}
function softRender() { const a = document.activeElement; if (a && a.closest && a.closest("#frm")) syncList(); else render(); }

function localUpsert(id, doc) {
  const i = S.rows.findIndex(r => r.id === id);
  if (i >= 0) S.rows[i] = { id, ...doc }; else S.rows.push({ id, ...doc });
  if (sheetsOn()) queueUpsert(id, doc);
}
async function saveRow(id, doc) {
  if (S.db) { await S.db.collection(COL).doc(id).set(doc); return; }
  if (CFG.nombre && !doc.registradoPor) doc.registradoPor = CFG.nombre;
  localUpsert(id, doc); saveLocal(); render(); sheetStatus(); flushSheet();
}
async function delRow(id) {
  if (S.db) { await S.db.collection(COL).doc(id).delete(); return; }
  S.rows = S.rows.filter(r => r.id !== id); if (sheetsOn()) queueDelete(id);
  saveLocal(); render(); sheetStatus(); flushSheet();
}
function teamPanel() {
  if (!TEAM) return "";
  if (TEAM_OK) return `<div class="panel"><h3>${ico("leaf")}Equipo en línea</h3>
    <p class="muted small" style="margin:0">Conectada a la base de datos del equipo (la misma de la app de Visitas). Todos los que abren la app ven las mismas reposiciones; se actualiza sola cada 15 segundos. ${pendCount() ? `<b style="color:var(--warn)">${pendCount()} por subir</b>; se suben solas al volver la señal.` : "Todo al día."}</p>
    <div class="field"><label for="t-nombre">Tu nombre (queda en cada reposición que registres)</label><input type="text" id="t-nombre" value="${esc(CFG.nombre || "")}" placeholder="Ej. Gonzalo Ibarra"></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn sm" data-act="s-sync">Actualizar ahora</button></div></div>`;
  return teamForm();
}
function teamForm() {
  return `<form class="panel" id="teamfrm" novalidate><h3>${ico("leaf")}Conectar con el equipo</h3>
    <p class="muted small" style="margin:0">Escribe el código del equipo (el mismo de la app de Visitas) para ver y registrar en línea las reposiciones de todos. Se pide una sola vez en este equipo.</p>
    <div class="field"><label for="t-code">Código del equipo</label><input type="password" id="t-code" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
    ${TEAM_MSG ? `<div class="err">${esc(TEAM_MSG)}</div>` : ""}
    <div><button type="submit" class="btn primary">Conectar</button></div></form>`;
}
function sheetPanel() { return TEAM ? teamPanel() : ""; }
const TEAMMSG = () => (typeof TEAM_OK !== "undefined" && TEAM_OK) ? " y se eliminará para todo el equipo" : "";
const newId = () => "r" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);

/* ---------- registrar ---------- */
const opt = (arr, sel, ph) => (ph != null ? `<option value="">${esc(ph)}</option>` : "") + arr.map(x => `<option ${x === sel ? "selected" : ""}>${esc(x)}</option>`).join("");
function varOptions(sel) {
  const extra = uniq(S.rows.map(r => r.variedad)).filter(v => v && !FOTOPER.dc.includes(v) && !FOTOPER.dn.includes(v));
  return `<option value="">Elige variedad</option>
    <optgroup label="Día corto">${opt(FOTOPER.dc, sel)}</optgroup>
    <optgroup label="Día neutro">${opt(FOTOPER.dn, sel)}</optgroup>
    ${extra.length ? `<optgroup label="Otras registradas">${opt(extra, sel)}</optgroup>` : ""}`;
}
function viewReg() {
  const F = S.form, ed = !!S.editId;
  const sectores = uniq(S.rows.filter(r => !F.productor || nrm(r.productor) === nrm(F.productor)).map(r => r.sector).filter(Boolean));
  return `<section class="view reg">
  <div class="col-form">
  ${TEAM && !TEAM_OK ? teamForm() : ""}
  <div class="h-row"><h2>${ed ? "Editar reposición" : "Nueva reposición"}</h2></div>
  ${ed ? `<div class="editbar"><span>Estás editando la reposición de <b>${esc(F.productor)}</b>. Cambia lo que necesites y presiona Guardar cambios.</span><button class="btn sm" data-act="cancel">Cancelar edición</button></div>` : ""}
  <form class="panel" id="frm" novalidate>
    <div class="grid2">
      <div class="field"><label for="f-fecha">Fecha</label><input type="date" id="f-fecha" name="fecha" value="${esc(F.fecha)}" required></div>
      <div class="field"><label for="f-productor">Productor</label><input type="text" id="f-productor" name="productor" list="dl-prod" value="${esc(F.productor)}" placeholder="Busca o escribe el nombre" autocomplete="off" required>
